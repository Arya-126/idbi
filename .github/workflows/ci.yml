name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check app
      # Smoke test: score every demo persona end-to-end (connectors → features
      # → dimensions → decision → ML). Fails loudly if any layer breaks.
      - run: |
          python - <<'EOF'
          from app.scoring.engine import score_gstin
          from app.personas import PERSONAS
          for p in PERSONAS:
              card = score_gstin(p.gstin)
              print(f"{p.trade_name:22} -> {card.composite_score}/{card.risk_band}")
          EOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `npm run build` runs `tsc && vite build`, so this type-checks too.
      - run: npm run build
